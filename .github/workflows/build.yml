name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test
      # dist/ is committed and is what the form fetches, so a PR that edits a
      # section without rebuilding would ship the previous build. Fail loudly.
      - name: dist is up to date with src
        run: git diff --exit-code -- dist || (echo "::error::dist/ is stale — run npm run build and commit the result" && exit 1)
